name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Lets Determinate Nix log in to FlakeHub with the job's GitHub identity.
  # Secure Packages and FlakeHub Cache need this.
  id-token: write

jobs:
  system:
    # Set the LINUX_RUNNER repository variable to use a larger runner,
    # for example UbuntuLatest32Cores128G.
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@main
      - run: nix build -L --keep-going .#amateur-swine

  installer:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@main
      - run: nix build -L --keep-going .#installer-iso
      - run: |
          mkdir iso
          cp -L result/iso/*.iso iso/
      - uses: actions/upload-artifact@v4
        with:
          name: amateur-swine-installer
          path: iso/*.iso
          compression-level: 0
          retention-days: 14

  success:
    runs-on: ubuntu-latest
    needs:
      - system
      - installer
    if: ${{ always() }}
    steps:
      - run: "true"
      - run: |
          echo "A dependent in the build matrix failed."
          exit 1
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
